  - id: guaranteed-launch
    editor: guzino
    date: "2026-11-24"
    reason: weak store id; a guaranteed-ads checklist is not a demo-to-production note, and cancelled launches without write-ups are unknown lethality
    critique:
      selection_filter: Launch advice is written about products that shipped and were discussed.
      visible_damage:
        - Success checklists
        - Guarantee language
      empty_regions:
        - Quietly cancelled launches
        - Demo-to-production gaps
      non_survivors:
        - id: bls-establishment-survival
          summary: Many new establishments do not survive.
          provenance: BLS BED
          confidence: 0.85
      unknown_lethality:
        - Launches cancelled before a public checklist or post-mortem existed
      survivorship_risk: 0.88
      confidence_adjustment: abstain
      caveats:
        - No public playbook can guarantee a launch.
      missing_categories:
        - Cancelled launches
      suggested_queries:
        - pre-launch kill rates inside comparable firms
